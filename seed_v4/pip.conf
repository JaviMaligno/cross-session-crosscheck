# Configuración de pip del equipo.
# El índice interno es el que usan los consumidores y el CI.
[global]
index-url = http://127.0.0.1:PORT/simple
# Las máquinas de desarrollo añaden PyPI como respaldo para poder instalar
# paquetes que todavía no se han espejado al índice interno.
extra-index-url = https://pypi.org/simple
