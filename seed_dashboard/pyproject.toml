[project]
name = "dashboard"
version = "1.2.0"
description = "Consumer app for widgetkit"
requires-python = ">=3.11"
dependencies = ["widgetkit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
